<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examen maken — VWO Biologie Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .question-block { border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; background: #fff; }
    .question-header { display: flex; gap: .75rem; align-items: baseline; margin-bottom: .5rem; }
    .q-num { font-weight: 700; font-size: 1rem; }
    .q-points { font-size: .8rem; color: var(--muted); }
    .q-text { font-size: .9rem; color: var(--muted); margin-bottom: .5rem; white-space: pre-wrap; }
    #submitBtn { width: 100%; padding: .75rem; font-size: 1rem; margin-top: .5rem; }
    #loadingMsg { display: none; padding: 1.5rem; text-align: center; font-style: italic; color: var(--muted); }
  </style>
</head>
<body>
<nav>
  <span class="brand">VWO Biologie Tracker</span>
  <a href="/">Dashboard</a>
  <a href="/exams.html">Examens</a>
</nav>
<main>
  <h1 id="examTitle">Examen laden…</h1>
  <p id="examMeta" style="color:var(--muted);margin-bottom:1.5rem"></p>
  <div id="flash"></div>
  <form id="examForm">
    <div id="questionsContainer"></div>
    <button type="submit" id="submitBtn" class="btn btn-success">Antwoorden inleveren</button>
  </form>
  <div id="loadingMsg">Claude corrigeert je antwoorden… even geduld.</div>
</main>
<script type="module" src="/js/attempt.js"></script>
</body>
</html>
